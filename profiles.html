<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ARChat — Профілі</title>

<link rel="stylesheet" href="styles.css">
<script src="profiles.js"></script>
</head>

<body>

<div class="page">

    <header class="topbar">
        <div class="logo">ARChat</div>
        <a href="index.html" class="home-link">Головна</a>
    </header>

    <main>

        <h1>Профілі</h1>

        <div id="profilesList" class="profiles-list"></div>

    </main>

</div>

<script>

const container = document.getElementById("profilesList");

Object.values(profiles).forEach(profile => {

    const card = document.createElement("a");

    card.className = "profile-card";
    card.href = `profiles/${profile.username}.html`;

    card.innerHTML = `
        <img
            class="profile-avatar"
            src="${profile.avatar}"
            alt="${profile.displayName}"
        >

        <div class="profile-info">

            <div class="profile-name">
                ${profile.displayName}
            </div>

            <div class="profile-status">
                ${profile.status}
            </div>

            <div class="profile-description">
                ${profile.description}
            </div>

            <div class="profile-posts">
                Дописів: ${profile.postsCount}
            </div>

        </div>
    `;

    container.appendChild(card);
});

</script>

</body>
</html>


</body>

</html>
