<!doctype html>
<html lang="uk">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Арчат — Профілі</title>


<style>

html,
body{
  margin:0;
  padding:0;

  background:#fff;

  font-family:Arial,Helvetica,sans-serif;

  font-size:12px;
  line-height:14px;

  color:#222;
}

*{
  box-sizing:border-box;
}

#archat-site{
  width:100%;
  min-height:100vh;

  margin:0;
  padding:12px;

  background:#fff;

  border:1px solid #777;
}

#archat-site a{
  color:#444;
}


/* =========================================================
   ВЕРХНЯ ПАНЕЛЬ
   ========================================================= */

.archat-header{

  margin:0 0 10px;

  padding:5px 8px;

  background:
    linear-gradient(#626262,#3b3b3b);

  border:1px solid #222;

  color:#fff;

  font-weight:bold;

  letter-spacing:1px;

  text-transform:uppercase;
}


/* =========================================================
   ОСНОВНИЙ КАРКАС
   ========================================================= */

.site-layout{

  display:table;

  width:100%;

  border-collapse:separate;

  border-spacing:10px 0;
}

.site-left{

  display:table-cell;

  width:165px;

  vertical-align:top;
}

.site-right{

  display:table-cell;

  vertical-align:top;
}


/* =========================================================
   ЛІВА КОЛОНКА
   ========================================================= */

.left-box{

  padding:3px 7px;

  background:#f0f0f0;

  border:1px solid #999;
}

.site-name{

  margin:1px 0 6px;

  padding:0 0 4px;

  border-bottom:1px solid #bcbcbc;

  color:#111;

  font-size:15px;

  line-height:17px;

  font-weight:bold;

  text-align:center;

  word-break:break-word;
}

.main-avatar{

  display:block;

  width:100%;

  height:228px;

  margin:0 0 6px;

  object-fit:cover;

  object-position:center center;

  background:#ddd;

  border:1px solid #888;
}

.archat-button{

  display:block;

  width:100%;

  margin:0 0 5px;

  padding:4px 0;

  background:
    linear-gradient(#fff176,#fbc02d);

  border:1px solid #a78119;

  color:#000 !important;

  font-size:10px;

  line-height:13px;

  font-weight:bold;

  text-align:center;

  text-decoration:none;

  text-transform:uppercase;
}

.archat-button:hover{

  background:
    linear-gradient(#fff59d,#fdd835);
}

.nav-menu{

  border-top:1px solid #999;
}

.nav-item{

  display:block;

  width:100%;

  padding:3px 2px;

  border-bottom:1px solid #c7c7c7;

  color:#444;

  font-size:11px;

  line-height:13px;

  text-decoration:underline;
}

.nav-item:hover{

  background:#e2e2e2;

  color:#000;

  text-decoration:none;
}

.account-box{

  margin:8px 0 0;

  padding:5px 4px;

  border-top:1px solid #999;

  text-align:center;
}

.account-text{

  margin:0 0 5px;

  color:#555;

  font-size:9px;

  line-height:12px;
}

.account-link{

  display:block;

  margin:2px 0;

  color:#444;

  font-size:10px;

  line-height:12px;

  font-weight:bold;

  text-decoration:underline;
}

.account-link:hover{

  color:#000;

  text-decoration:none;
}


/* =========================================================
   ЗАГОЛОВОК
   ========================================================= */

.page-title{

  margin:0 0 8px;

  padding:6px 8px;

  background:#f0f0f0;

  border:1px solid #999;

  font-weight:bold;
}


/* =========================================================
   ПРОФІЛІ
   ========================================================= */

.profiles-box{

  margin:0;

  padding:7px;

  background:#fff;

  border:1px solid #aaa;
}


/* =========================================================
   КАРТКА ПРОФІЛЮ
   ========================================================= */

.profile-card{

  display:flex;

  width:100%;

  margin:0 0 7px;

  padding:6px;

  background:#f9f9f9;

  border:1px solid #aaa;
}

.profile-card:last-child{

  margin-bottom:0;
}


/* =========================================================
   АВАТАР
   ========================================================= */

.profile-avatar{

  flex:0 0 75px;

  width:75px;

  height:75px;

  margin-right:8px;

  object-fit:cover;

  background:#ddd;

  border:1px solid #888;
}


/* =========================================================
   ІНФОРМАЦІЯ
   ========================================================= */

.profile-card-info{

  min-width:0;

  flex:1;
}

.profile-card-name{

  margin:0 0 3px;

  font-size:13px;

  line-height:15px;

  font-weight:bold;
}

.profile-card-name a{

  color:#222;

  text-decoration:underline;
}

.profile-card-name a:hover{

  color:#000;

  text-decoration:none;
}

.profile-card-status{

  margin:0 0 4px;

  color:#555;

  font-size:10px;

  line-height:12px;
}

.profile-card-description{

  margin:0 0 5px;

  color:#444;

  font-size:10px;

  line-height:13px;
}

.profile-card-stats{

  color:#777;

  font-size:9px;

  line-height:11px;
}


/* =========================================================
   СТАТУСИ
   ========================================================= */

.status{

  font-size:10px;
}

.status-online{

  color:#2e7d32;

  font-weight:bold;
}

.status-recent{

  color:#777;
}

.status-offline{

  color:#999;
}


/* =========================================================
   ПУСТО
   ========================================================= */

.profiles-empty{

  padding:15px;

  color:#777;

  text-align:center;

  font-size:11px;
}


/* =========================================================
   ПРАВИЛА
   ========================================================= */

.rules-box{

  margin:8px 0 0;

  padding:5px 8px;

  background:#fff;

  border:1px solid #aaa;

  color:#444;

  font-size:11px;

  line-height:14px;
}

.rules-box a{

  color:#333;

  font-weight:bold;

  text-decoration:underline;
}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

.statistics-box{

  margin:8px 0 0;

  padding:5px 8px;

  background:#fff;

  border:1px solid #aaa;

  color:#555;

  font-family:
    "Courier New",
    Courier,
    monospace;

  font-size:10px;

  line-height:13px;
}

.statistics-title{

  margin:0 0 3px;

  color:#333;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size:10px;

  line-height:12px;

  font-weight:bold;
}

.statistics-number{

  color:#222;

  font-weight:bold;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer-line{

  margin-top:7px;

  padding-top:4px;

  border-top:1px solid #ccc;

  color:#888;

  font-size:9px;

  line-height:11px;

  text-align:center;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .site-layout{

    display:block;
  }

  .site-left,
  .site-right{

    display:block;

    width:100%;
  }

  .site-left{

    margin-bottom:8px;
  }

  #archat-site{

    padding:7px;
  }

  .profile-avatar{

    flex-basis:65px;

    width:65px;

    height:65px;
  }

}

</style>

</head>

<script src="profiles.js"></script>


<script>

(function(){

  var container =
    document.getElementById(
      "profiles-list"
    );

  var countElement =
    document.getElementById(
      "profiles-count"
    );


  if(
    typeof ARCHAT_PROFILES ===
    "undefined" ||

    !Array.isArray(
      ARCHAT_PROFILES
    )
  ){

    container.innerHTML =
      '<div class="profiles-empty">' +
      'Не вдалося завантажити профілі.' +
      '</div>';

    return;
  }


  container.innerHTML="";


  countElement.textContent =
    ARCHAT_PROFILES.length;


  if(
    ARCHAT_PROFILES.length===0
  ){

    container.innerHTML =
      '<div class="profiles-empty">' +
      'Профілів поки немає.' +
      '</div>';

    return;
  }


  ARCHAT_PROFILES.forEach(
    function(profile){

      var card =
        document.createElement(
          "div"
        );

      card.className =
        "profile-card";


      /* AVATAR */

      var avatar =
        document.createElement(
          "img"
        );

      avatar.className =
        "profile-avatar";

      avatar.src =
        profile.avatar || "";

      avatar.alt =
        profile.nickname || "";

      card.appendChild(
        avatar
      );


      /* INFO */

      var info =
        document.createElement(
          "div"
        );

      info.className =
        "profile-card-info";


      /* NICKNAME */

      var name =
        document.createElement(
          "div"
        );

      name.className =
        "profile-card-name";


      var link =
        document.createElement(
          "a"
        );

      link.href =
        profile.url || "#";

      link.textContent =
        profile.nickname ||
        "Без ніку";


      name.appendChild(
        link
      );


      /* STATUS */

      var status =
        document.createElement(
          "div"
        );

      status.className =
        "profile-card-status";


      var statusClass =
        "status-offline";


      if(
        profile.status ===
        "online"
      ){

        statusClass =
          "status-online";

      }else if(
        profile.status ===
        "recent"
      ){

        statusClass =
          "status-recent";
      }


      status.innerHTML =
        '<span class="status ' +
        statusClass +
        '">' +
        (
          profile.statusText ||
          "офлайн"
        ) +
        '</span>';


      /* DESCRIPTION */

      var description =
        document.createElement(
          "div"
        );

      description.className =
        "profile-card-description";

      description.textContent =
        profile.description || "";


      /* POSTS */

      var stats =
        document.createElement(
          "div"
        );

      stats.className =
        "profile-card-stats";

      stats.textContent =
        "Дописи: " +
        Number(
          profile.posts || 0
        ).toLocaleString(
          "uk-UA"
        );


      info.appendChild(
        name
      );

      info.appendChild(
        status
      );

      info.appendChild(
        description
      );

      info.appendChild(
        stats
      );


      card.appendChild(
        info
      );


      container.appendChild(
        card
      );

    }
  );

})();

</script>
