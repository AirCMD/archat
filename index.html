<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гуменчат — тест профілів</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  color:#222;
}

*{
  box-sizing:border-box;
}

#site{
  width:100%;
  min-height:100vh;
  padding:12px;
  border:1px solid #777;
}

.header{
  margin-bottom:10px;
  padding:6px 8px;
  background:linear-gradient(#626262,#3b3b3b);
  border:1px solid #222;
  color:#fff;
  font-weight:bold;
  letter-spacing:1px;
}

.profile-list{
  max-width:700px;
  margin:auto;
}

.profile-card{
  display:flex;
  gap:10px;
  margin-bottom:8px;
  padding:7px;
  background:#f5f5f5;
  border:1px solid #aaa;
}

.profile-card img{
  width:80px;
  height:80px;
  object-fit:cover;
  background:#ddd;
  border:1px solid #888;
}

.profile-card-content{
  flex:1;
}

.profile-name{
  margin-bottom:5px;
  font-weight:bold;
  font-size:14px;
}

.profile-link{
  color:#444;
  text-decoration:underline;
}

.profile-link:hover{
  color:#000;
}

.profile-description{
  color:#666;
  line-height:15px;
}

.footer{
  margin-top:15px;
  padding-top:5px;
  border-top:1px solid #ccc;
  color:#888;
  text-align:center;
  font-size:9px;
}
</style>
</head>

<body>

<div id="site">

<div class="header">
ГУМЕНЧАТ — ТЕСТ ПРОФІЛІВ
</div>

<div class="profile-list">

<div class="profile-card">

<img
src="assets/avatars/copy_pasta.jpg"
alt="copy_pasta"
>

<div class="profile-card-content">

<div class="profile-name">
copy_pasta
</div>

<div class="profile-description">
Лінива, емоційна та трохи дивна.
</div>

<br>

<a
class="profile-link"
href="profiles/copy_pasta.html"
>
Відкрити профіль →
</a>

</div>

</div>


<div class="profile-card">

<img
src="assets/avatars/dreaming_romance.jpg"
alt="dreaming_romance"
>

<div class="profile-card-content">

<div class="profile-name">
dreaming_romance
</div>

<div class="profile-description">
Романтичний гумень, який завжди щось вигадує.
</div>

<br>

<a
class="profile-link"
href="profiles/dreaming_romance.html"
>
Відкрити профіль →
</a>

</div>

</div>


<div class="profile-card">

<img
src="assets/avatars/sakurai_agatsuma.jpg"
alt="sakurai_agatsuma"
>

<div class="profile-card-content">

<div class="profile-name">
sakurai_agatsuma
</div>

<div class="profile-description">
Любить коментувати чужі дописи.
</div>

<br>

<a
class="profile-link"
href="profiles/sakurai_agatsuma.html"
>
Відкрити профіль →
</a>

</div>

</div>

</div>

<div class="footer">
Гуменчат — тестова система профілів.
</div>

</div>

</body>
</html>
